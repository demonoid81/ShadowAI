services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowai
      POSTGRES_USER: shadowai
      POSTGRES_PASSWORD: shadowai_secret
    # Postgres доступен только с хоста (для миграций через make) и
    # внутри docker-сети (для backend). Никогда не экспортировать в
    # интернет — сейчас используется default-password 'shadowai_secret'.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Redis также только на localhost — без auth, кэш и rate-limit
    # хранятся открыто.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ВАЖНО: GET /metrics экспортирует Prometheus-телеметрию (audit queue,
    # firewall decisions, budget blocks) и НЕ защищён app-level auth.
    #
    # Backend биндится ТОЛЬКО на 127.0.0.1, поэтому:
    #   - frontend nginx (который внутри той же docker-сети) проксирует
    #     /api и /proxy на backend:8080
    #   - извне порт 8080 недоступен — /metrics нельзя scrape'нуть с хоста
    #   - Prometheus-scraper должен быть в той же docker-сети
    #     (compose network 'default' или явная overlay)
    #
    # Если нужен external scrape — добавить basic auth / IP-allowlist на
    # nginx-уровне. См. README секцию "Observability (Prometheus)".
    #
    # Для отладки backend напрямую с хоста можно временно изменить на
    # "8080:8080" ЛОКАЛЬНО, но НЕ коммитить.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://shadowai:shadowai_secret@postgres:5432/shadowai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-32chars!!
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowai
      POSTGRES_USER: shadowai
      POSTGRES_PASSWORD: shadowai_secret
    # Postgres bind только на loopback: доступен с docker-хоста
    # (для миграций через make) и внутри docker-сети (для backend),
    # но НЕ с других машин. Никогда не менять на 0.0.0.0/публичный —
    # используется default-password 'shadowai_secret'.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Redis bind только на loopback — доступен с docker-хоста и из
    # docker-сети, но не извне. Без auth: кэш и rate-limit-state хранятся
    # открыто, поэтому публиковать наружу категорически нельзя.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ВАЖНО: GET /metrics экспортирует Prometheus-телеметрию (audit queue,
    # firewall decisions, budget blocks) и НЕ защищён app-level auth.
    #
    # Port-publish ограничен loopback'ом (127.0.0.1):
    #   - С самого docker-хоста (localhost:8080) backend ДОСТУПЕН —
    #     это нужно для отладки, make migrate и т.п.
    #   - ИЗВНЕ docker-хоста (другие машины в сети) — НЕдоступен, т.к.
    #     Docker bind'ит порт только на loopback-интерфейс.
    #   - Prometheus-scraper должен быть в той же docker-сети
    #     (сервис внутри compose network) либо на docker-хосте;
    #     для scrape из другого хоста используйте reverse proxy с auth.
    #
    # Reverse proxy (frontend nginx) проксирует только /api и /proxy на
    # backend:8080 внутри docker-сети, но НЕ /metrics — см. nginx.conf.
    #
    # В prod считать этот bind МИНИМУМОМ: если docker-хост публичный,
    # дополнительно ограничить host firewall'ом (iptables/ufw).
    # См. README секцию "Observability (Prometheus)".
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://shadowai:shadowai_secret@postgres:5432/shadowai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-32chars!!
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowai
      POSTGRES_USER: shadowai
      POSTGRES_PASSWORD: shadowai_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ВАЖНО: GET /metrics экспортирует Prometheus-телеметрию (audit queue,
    # firewall decisions, budget blocks) и НЕ защищён app-level auth.
    # В prod:
    #   - либо не публиковать порт 8080 наружу, а проксировать только /api и
    #     /proxy через reverse proxy с ACL на /metrics,
    #   - либо добавить basic auth / IP-allowlist на /metrics на уровне
    #     ingress (nginx auth_basic, Traefik middleware, mTLS).
    # Публикация /metrics без ограничений = утечка runtime и security
    # телеметрии наружу.
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shadowai:shadowai_secret@postgres:5432/shadowai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-32chars!!
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

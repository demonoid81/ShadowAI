# ShadowAI Helm chart — base values (dev/staging defaults).
# Override with values-prod.yaml for production.
#
# SECRET VALUES (database passwords, JWT secrets, API keys) must NEVER be
# placed here. Use:
#   - Kubernetes Secrets (created out-of-band or via external-secrets-operator)
#   - Pass --set secrets.jwtSecret=... at deploy time
#   - Seal with Sealed Secrets / Vault
#
# Required secrets (create before install):
#   kubectl create secret generic shadowai-secrets \
#     --from-literal=databaseUrl='postgres://...' \
#     --from-literal=jwtSecret='...' \
#     --from-literal=redisUrl='redis://...'

replicaCount: 1

image:
  repository: shadowai
  pullPolicy: IfNotPresent
  tag: "latest"
  # Set to "enterprise" for enterprise build.
  variant: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Secret reference. All sensitive values come from a K8s Secret.
# Create the secret before installing the chart.
existingSecret: "shadowai-secrets"

# Non-secret application config passed as env vars via ConfigMap (envFrom).
# Keys MUST be SCREAMING_SNAKE_CASE matching the actual env var names.
# See internal/config/config.go for all available options.
config:
  APP_ENV: "development"
  SERVER_PORT: "8080"
  AUDIT_PAYLOAD_MODE: "redacted"
  AUDIT_RETENTION_DAYS: "30"
  AUDIT_PURGE_INTERVAL: "24h"
  AUDIT_PURGE_CHUNK_SIZE: "1000"
  STREAMING_MODE: "buffered"
  FIREWALL_ENABLED: "true"

  # W8: Additional independent anchor sink (opt-in, default disabled).
  # Enable to publish signed Merkle anchor manifests to a second independent backend.
  # One signed manifest is written to ALL configured sinks (no re-signing).
  # Partial failure is logged and recorded in audit_chain_anchor_sinks table.
  #
  # Recommended independent pairs (choose based on your primary sink):
  #   primary=file://, additional=immudb://  → local PVC + external append-only ledger
  #   primary=immudb://, additional=file://  → external ledger + local PVC backup
  #
  # Supported schemes: "file://" | "immudb://"  (S3 anchor sink not yet implemented)
  AUDIT_ANCHOR_ADDITIONAL_SINKS: ""          # e.g. "file://" or "immudb://"
  AUDIT_ANCHOR_ADDITIONAL_SINK_FILE_PATH: "" # required when additional sinks contains "file://"
  # Note: additional immudb:// uses AUDIT_IMMUDB_* env vars (set in K8s Secret).
  # The additional file:// path must be on a writable mount (PVC or /tmp for ephemeral).

  # Add more env vars as needed, e.g.:
  # OIDC_ENABLED: "true"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: shadowai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: shadowai-tls
  #    hosts:
  #      - shadowai.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Liveness: is the process alive?
livenessProbe:
  httpGet:
    path: /api/health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness: can the process serve traffic? (checks DB + Redis)
readinessProbe:
  httpGet:
    path: /api/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Run database migrations as an init container before the app starts.
migrations:
  enabled: true
  enterpriseMigrationsDir: ""  # set to /migrations-enterprise for enterprise builds

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shadowai
          topologyKey: kubernetes.io/hostname

# Scheduled audit-verify CronJob for tamper-evidence chain verification.
# Set enabled=true to schedule periodic chain/anchor integrity checks.
# Alert: kube_job_failed{job_name=~".*audit-verify.*"} > 0
auditVerifyCron:
  enabled: false
  schedule: "0 3 * * *"  # daily at 03:00
  verbose: false
  chainSecret: false      # set true if AUDIT_CHAIN_SECRET is in the K8s Secret

# PR-O4.1: Automated evidence bundle export + offline verification CronJob.
# Exports WORM evidence bundles on a schedule, verifies them offline, and alerts
# on failure. Use in conjunction with auditVerifyCron for full compliance coverage.
evidenceExport:
  enabled: false

  # Cron schedule (default: nightly at 02:00 UTC).
  schedule: "0 2 * * *"

  # mode: global | tenants
  #   global  — exports all orgs as a single global bundle (--global flag).
  #   tenants — exports one bundle per org_id listed in orgIDs.
  mode: global

  # orgIDs: required when mode=tenants. List of org UUIDs to export.
  orgIDs: []
  # orgIDs:
  #   - "00000000-0000-0000-0000-000000000001"
  #   - "aaaaaaaa-0000-4000-8000-000000000001"

  # retentionDays: delete bundles older than N days from /exports.
  retentionDays: 90

  # storage: pvc | s3
  #   pvc — bundles stored on a PVC at /exports (O4.1, default)
  #   s3  — bundles exported to /tmp, verified, then uploaded via evidence-upload
  storage: pvc

  # pvc: PVC configuration when storage=pvc.
  pvc:
    size: 10Gi
    storageClass: ""   # leave empty for cluster default

  # s3: S3-compatible storage configuration when storage=s3.
  # Credentials read from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars
  # (injected from s3.secretName / s3.*Key values below).
  s3:
    # bucket: required when storage=s3.
    bucket: ""
    # prefix: S3 object path prefix. Bundle key: <prefix>/<YYYY>/<MM>/<DD>/<name>.zip
    prefix: "shadowai/evidence"
    # region: AWS region.
    region: "us-east-1"
    # endpoint: custom S3-compatible endpoint (MinIO, GCS, etc.). Leave empty for AWS.
    endpoint: ""
    # forcePathStyle: required for most MinIO installations.
    forcePathStyle: false
    # secretName: K8s Secret containing S3 credentials.
    # Defaults to existingSecret when empty.
    secretName: ""
    # accessKeyIDKey: Secret key for AWS_ACCESS_KEY_ID.
    accessKeyIDKey: s3AccessKeyID
    # secretAccessKeyKey: Secret key for AWS_SECRET_ACCESS_KEY.
    secretAccessKeyKey: s3SecretAccessKey
    # stagingSize: emptyDir size limit for local bundle staging before S3 upload.
    stagingSize: "2Gi"
    # sse: Server-Side Encryption. "AES256" (default, AWS S3) or "none" (MinIO/custom S3).
    sse: "AES256"
    # objectLock: S3 Object Lock / WORM retention (O4.3).
    # Requires the bucket to have Object Lock enabled at creation time.
    # See runbook section "S3 Object Lock Prerequisites" for bucket setup.
    objectLock:
      enabled: false
      # mode: GOVERNANCE (can be overridden by privileged users) or
      #        COMPLIANCE (immutable — cannot be shortened even by root).
      mode: "COMPLIANCE"
      # retentionDays: each uploaded bundle is locked for this many days from upload time.
      # Typical values: 90 (quarterly audit), 365 (annual), 2555 (7-year regulatory).
      retentionDays: 90
      # legalHold: "ON" | "OFF" | "" (empty = don't set legal hold header).
      # Legal hold is independent of retention and prevents deletion until explicitly removed.
      legalHold: ""

  # zip: create <output>.zip archive after export.
  zip: false

  # chainSecret: set true when AUDIT_CHAIN_SECRET is in the K8s Secret.
  # When true, the CronJob runs an additional live audit-verify --include-anchors
  # step after bundle export+verify. This performs W2 HMAC chain verification
  # against the source DB (not the bundle). Bundle-mode verify never uses
  # AUDIT_CHAIN_SECRET — the live step is separate and complementary.
  chainSecret: false

  # pubKeyFile: path inside the container to the Ed25519 public key.
  # When set, the key is mounted from existingSecret.anchorPubKey.
  pubKeyFile: ""  # e.g. /etc/shadowai/anchor-pubkey.b64

  # deadlineSeconds: hard deadline for the Job (default 60 min).
  deadlineSeconds: 3600

  # resources for the evidence-export container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # alerts: PrometheusRule configuration.
  alerts:
    enabled: false
    severity: critical
    evaluationInterval: 1m
    # missingAfterSeconds: fire EvidenceExportJobMissing after this many seconds
    # since the last successful schedule. Default: 48h (2 days = 2× daily schedule).
    missingAfterSeconds: 172800
    # ruleLabels: extra labels applied to the PrometheusRule (for routing/matching).
    ruleLabels: {}
    # ruleLabels:
    #   prometheus: kube-prometheus

# ─────────────────────────────────────────────────────────────────────────────
# evidenceAuditReport (O4.4): periodic S3 retention posture report.
# Reads S3 List + HeadObject — no database access required.
# exit 0 = all compliant; exit 1 = violations found (alert fires);
# exit 2 = S3 access / config error.
# ─────────────────────────────────────────────────────────────────────────────
evidenceAuditReport:
  enabled: false
  # schedule: weekly Monday 08:00 UTC — after the nightly export has run.
  schedule: "0 8 * * 1"

  # bucket + prefix: defaults to evidenceExport.s3.* when left empty.
  bucket: ""
  prefix: "shadowai/evidence"
  region: "us-east-1"
  endpoint: ""
  forcePathStyle: false

  # Policy flags: same semantics as audit-evidence-report CLI.
  requireLock: true
  minRetentionDays: 90

  # format: "json" produces machine-readable output captured in Job logs.
  # Use "table" for human-readable operator output.
  format: "json"

  # secretName: K8s Secret containing AWS credentials.
  # Defaults to evidenceExport.s3.secretName → existingSecret when empty.
  secretName: ""
  accessKeyIDKey: s3AccessKeyID
  secretAccessKeyKey: s3SecretAccessKey

  deadlineSeconds: 600

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # alerts: PrometheusRule configuration for the audit-report CronJob.
  # Rendered inside the same PrometheusRule as evidenceExport alerts.
  # Requires evidenceExport.alerts.enabled=true OR standalone rule (see below).
  alerts:
    enabled: true
    severity: warning
    # missingAfterSeconds: fire after N seconds without a successful schedule.
    # Default 7 days (1× weekly period) — fires if Monday's run is skipped.
    missingAfterSeconds: 604800

# ─────────────────────────────────────────────────────────────────────────────
# evidenceCollection (SOC2.2): scheduled compliance evidence package collection.
# Runs audit-collect-evidence, uploads result to S3 (with optional Object Lock),
# and fires alerts on failure/missing schedule.
#
# Opt-in: enabled=false by default.
# Requires: storage=s3 (no PVC mode; evidence package must be durably stored).
# See docs/runbooks/evidence-collection.md for the full operational guide.
# ─────────────────────────────────────────────────────────────────────────────
evidenceCollection:
  enabled: false

  # schedule: when to run the collection job.
  # Examples:
  #   "0 4 1 * *"    — 1st of every month at 04:00 UTC (monthly cadence)
  #   "0 4 1 1,4,7,10 *" — quarterly (1st of Jan/Apr/Jul/Oct)
  schedule: "0 4 1 1,4,7,10 *"   # quarterly

  # periodMode: how the collection period is determined.
  #   previous_month   — calendar month before current (e.g. run in Feb → Jan)
  #   previous_quarter — calendar quarter before current (e.g. run in Q2 → Q1)
  #   explicit         — use periodFrom / periodTo directly
  #
  # Quarter boundaries are calendar (Q1=Jan–Mar, Q2=Apr–Jun, Q3=Jul–Sep, Q4=Oct–Dec).
  # Year-boundary case: running in Q1 → previous quarter is Q4 of the prior year.
  periodMode: "previous_quarter"

  # periodFrom/periodTo: required when periodMode=explicit. Format: YYYY-MM-DD.
  periodFrom: ""
  periodTo: ""

  # controlsDoc: path inside the container to soc2-iso-control-mapping.md.
  # Leave empty to omit control mapping snapshot (added to not_collected).
  controlsDoc: ""

  # allowIncomplete: if true, Job exits 0 even when some controls are not_collected.
  # Package will contain evidence/not_collected.json describing missing items.
  # Default false (strict: Job fails if any controls are missing).
  allowIncomplete: false

  # chainVerify: pass DATABASE_URL, AUDIT_CHAIN_SECRET, and optional anchorPubKey
  # to audit-collect-evidence so it can run audit-verify --restore-drill.
  # Restore-drill now requires a signing pubkey/keyring for full W7 signature verification.
  # If anchorPubKey is absent, chain verification is reported as not_collected.
  # Requires DB connectivity from the Job.
  chainVerify:
    enabled: false
    # secretName: K8s Secret containing databaseUrl and auditChainSecret.
    # Defaults to existingSecret when empty.
    secretName: ""

  # s3: S3-compatible storage for evidence package upload (required).
  # Object Lock is strongly recommended for compliance-grade immutability.
  # See docs/evidence-export-runbook.md §2 for bucket prerequisites.
  s3:
    # bucket: REQUIRED when evidenceCollection.enabled=true.
    bucket: ""
    prefix: "shadowai/evidence-collection"
    region: "us-east-1"
    endpoint: ""           # empty = AWS S3; set for MinIO/GCS
    forcePathStyle: false  # true for MinIO
    sse: "AES256"          # "none" for MinIO targets that reject AES256
    # secretName: K8s Secret with AWS credentials.
    # Defaults to existingSecret when empty.
    secretName: ""
    accessKeyIDKey: s3AccessKeyID
    secretAccessKeyKey: s3SecretAccessKey
    # objectLock: S3 Object Lock for immutable compliance storage.
    # Requires bucket created with Object Lock enabled (ops/Terraform responsibility).
    objectLock:
      enabled: false
      mode: "COMPLIANCE"       # COMPLIANCE (immutable even by root) or GOVERNANCE
      retentionDays: 2555      # 7 years — typical regulatory compliance retention
      legalHold: ""            # "ON" | "OFF" | "" (omit header)

  deadlineSeconds: 1800   # 30 minutes hard Job deadline

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # alerts: PrometheusRule alerts for the evidence collection CronJob.
  alerts:
    enabled: true
    severity: critical
    # missingAfterSeconds: fire if CronJob has not run in this window.
    # Default: ~31 days (covers both monthly and quarterly schedules).
    missingAfterSeconds: 2678400   # 31 days

serviceAccount:
  create: true
  annotations: {}
  name: ""

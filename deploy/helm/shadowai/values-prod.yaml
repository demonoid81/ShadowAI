# Production overrides for ShadowAI Helm chart.
# Apply with: helm upgrade shadowai ./deploy/helm/shadowai -f values-prod.yaml
#
# See docs/production-hardening.md for:
#   - Supported operating envelope and known limits
#   - Mandatory secrets checklist
#   - SIEM / evidence / streaming sizing guidance
#   - Pre-launch checklist
#
# OPERATOR-SPECIFIC values (not set here — must be customized per deployment):
#   config.OIDC_ISSUER_URL, config.OIDC_CLIENT_ID   — customer IdP
#   config.SIEM_ENDPOINT                             — customer SIEM
#   evidenceExport.s3.bucket                         — customer S3 bucket
#   image.tag                                        — set at deploy time via --set
#   ingress.hosts                                    — customer domain

replicaCount: 3

image:
  pullPolicy: Always
  tag: "" # REQUIRED: set at deploy time: --set image.tag=<git-sha>

config:
  APP_ENV: "production"
  AUDIT_PAYLOAD_MODE: "redacted"
  AUDIT_RETENTION_DAYS: "90"
  AUDIT_PURGE_INTERVAL: "24h"
  AUDIT_PURGE_CHUNK_SIZE: "1000"

  # Streaming: buffered is the safe production default.
  # Do NOT enable incremental until the 30-day proof window is complete.
  # See docs/runbooks/streaming-production-proof.md for the full process:
  #   Stage 0: baseline buffered (7 days)
  #   Stage 1: shadow mode (14 days, 0 policy_action mismatches required)
  #   Stage 2: limited incremental canary (8 days)
  #   Stage 3: promotion review + operator sign-off
  # Additional F7.6 constraint: Anthropic/Gemini/Ollama use identity-stub EmitSanitized —
  # sanitize does NOT modify content for these providers (F7.x scope for full support).
  STREAMING_MODE: "buffered"
  # STREAMING_ALLOW_INCREMENTAL_IN_PROD: "true"   # explicit opt-in; complete proof window first

  FIREWALL_ENABLED: "true"
  # Semantic V2 shadow mode: do not enforce until corpus baseline is established.
  FIREWALL_SA_V2_ENABLED: "false"

  # SIEM async delivery tuning (defaults shown; tune for your audit volume).
  # See docs/production-hardening.md §4 for sizing guidance.
  # SIEM_ENABLED: "true"                     # set when SIEM_ENDPOINT is configured
  # SIEM_ENDPOINT: ""                        # REQUIRED when SIEM_ENABLED=true; customer-specific
  SIEM_QUEUE_SIZE: "5000"                    # 1000 default → 5000 for prod burst
  SIEM_BATCH_SIZE: "100"                     # 50 default → 100 for higher throughput
  SIEM_FLUSH_INTERVAL: "5s"
  SIEM_MAX_RETRIES: "5"                      # 3 default → 5 for more resilient delivery
  SIEM_DROP_POLICY: "drop_oldest"
  SIEM_TIMEOUT: "5s"                         # 3s default → 5s for high-latency SIEM

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2  # always keep 2 pods running during rolling updates

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.shadowai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shadowai-prod-tls
      hosts:
        - api.shadowai.example.com

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 4

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 2

migrations:
  enabled: true
  enterpriseMigrationsDir: "/migrations-enterprise"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: shadowai
        topologyKey: kubernetes.io/hostname

# PR-O4.1: Evidence export automation — enabled in production.
evidenceExport:
  enabled: true
  schedule: "0 2 * * *"   # nightly at 02:00 UTC
  mode: global             # export all orgs; switch to tenants for per-org bundles
  retentionDays: 90
  # storage: pvc (default) or s3 — set to s3 for durable compliance storage
  storage: pvc
  pvc:
    size: 20Gi
  # Uncomment and configure to switch to S3-backed storage (O4.2):
  # storage: s3
  # s3:
  #   bucket: "shadowai-compliance-ACCOUNT_ID"
  #   prefix: "shadowai/evidence"
  #   region: "us-east-1"
  #   endpoint: ""             # empty = AWS S3; set for MinIO/GCS
  #   forcePathStyle: false     # true for MinIO
  #   secretName: ""            # defaults to existingSecret
  #   accessKeyIDKey: s3AccessKeyID
  #   secretAccessKeyKey: s3SecretAccessKey
  chainSecret: true        # AUDIT_CHAIN_SECRET available in prod secret
  zip: true                # archive bundles to save space
  deadlineSeconds: 7200    # 2h hard deadline for large deployments
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  alerts:
    enabled: true
    severity: critical
    missingAfterSeconds: 172800   # 48h = 2× daily schedule
    ruleLabels:
      prometheus: kube-prometheus  # adjust to match your Prometheus operator selector

# PR-O4.4: Weekly retention posture audit report.
# REQUIRES storage: s3 — the audit report reads S3 List+HeadObject.
# Enable this when evidenceExport.storage is switched to s3 and bucket is configured.
# EvidenceAuditReportJobFailed alert fires on exit 1 (violations) or exit 2 (S3 error).
evidenceAuditReport:
  enabled: false   # Enable when evidenceExport.storage: s3 is configured
  schedule: "0 8 * * 1"   # Mondays 08:00 UTC — after nightly export has settled
  # bucket: ""             # defaults to evidenceExport.s3.bucket when storage=s3
  requireLock: true
  minRetentionDays: 90
  format: json
  alerts:
    enabled: true
    severity: warning
    missingAfterSeconds: 604800   # 7 days = 1× weekly schedule

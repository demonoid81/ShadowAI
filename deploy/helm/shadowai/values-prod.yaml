# Production overrides for ShadowAI Helm chart.
# Apply with: helm upgrade shadowai ./deploy/helm/shadowai -f values-prod.yaml

replicaCount: 3

image:
  pullPolicy: Always
  tag: "" # set at deploy time: --set image.tag=<git-sha>

config:
  APP_ENV: "production"
  AUDIT_PAYLOAD_MODE: "redacted"
  AUDIT_RETENTION_DAYS: "90"
  AUDIT_PURGE_INTERVAL: "24h"
  AUDIT_PURGE_CHUNK_SIZE: "1000"
  STREAMING_MODE: "buffered"
  FIREWALL_ENABLED: "true"
  # STREAMING_ALLOW_INCREMENTAL_IN_PROD: "true"  # explicit opt-in only

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2  # always keep 2 pods running during rolling updates

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.shadowai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shadowai-prod-tls
      hosts:
        - api.shadowai.example.com

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 4

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 2

migrations:
  enabled: true
  enterpriseMigrationsDir: "/migrations-enterprise"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: shadowai
        topologyKey: kubernetes.io/hostname

# PR-O4.1: Evidence export automation — enabled in production.
evidenceExport:
  enabled: true
  schedule: "0 2 * * *"   # nightly at 02:00 UTC
  mode: global             # export all orgs; switch to tenants for per-org bundles
  retentionDays: 90
  storage: pvc
  pvc:
    size: 20Gi
  chainSecret: true        # AUDIT_CHAIN_SECRET available in prod secret
  zip: true                # archive bundles to save space
  deadlineSeconds: 7200    # 2h hard deadline for large deployments
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  alerts:
    enabled: true
    severity: critical
    missingAfterSeconds: 172800   # 48h = 2× daily schedule
    ruleLabels:
      prometheus: kube-prometheus  # adjust to match your Prometheus operator selector

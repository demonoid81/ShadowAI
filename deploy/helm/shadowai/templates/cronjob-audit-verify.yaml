{{- if .Values.auditVerifyCron.enabled }}
# PR-O1: Scheduled audit-verify job for tamper-evidence chain and anchor verification.
# Mode depends on auditVerifyCron.chainSecret:
#   chainSecret=false (default) → audit-verify --anchor-only  (W3 Merkle anchor verification only)
#   chainSecret=true            → audit-verify --include-anchors (W2 HMAC chain + W3 anchor verification)
# Alert fires via kube_job_failed when the job exits 1 (anomaly detected).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "shadowai.fullname" . }}-audit-verify
  labels:
    {{- include "shadowai.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.auditVerifyCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0   # no retry — failure means an anomaly, not a transient error
      template:
        metadata:
          labels:
            {{- include "shadowai.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: audit-verify
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: audit-verify
              image: {{ include "shadowai.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - audit-verify
                {{- if .Values.auditVerifyCron.chainSecret }}
                # AUDIT_CHAIN_SECRET available → run W2 chain + W3 anchor verification.
                - --include-anchors
                {{- else }}
                # No chain secret → W3 anchor-only (no HMAC chain verification).
                - --anchor-only
                {{- end }}
                - --table
                - all
                {{- if .Values.auditVerifyCron.verbose }}
                - --verbose
                {{- end }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: databaseUrl
                {{- if .Values.auditVerifyCron.chainSecret }}
                - name: AUDIT_CHAIN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: auditChainSecret
                {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
{{- end }}

{{- if .Values.evidenceExport.enabled }}
{{- $validModes := list "global" "tenants" }}
{{- if not (has .Values.evidenceExport.mode $validModes) }}
{{- fail (printf "evidenceExport.mode must be one of %v, got %q" $validModes .Values.evidenceExport.mode) }}
{{- end }}
{{- $validStorage := list "pvc" "s3" }}
{{- if not (has .Values.evidenceExport.storage $validStorage) }}
{{- fail (printf "evidenceExport.storage must be one of %v, got %q" $validStorage .Values.evidenceExport.storage) }}
{{- end }}
{{- if and (eq .Values.evidenceExport.storage "s3") (empty .Values.evidenceExport.s3.bucket) }}
{{- fail "evidenceExport.s3.bucket must not be empty when storage=s3" }}
{{- end }}
{{- if and (eq .Values.evidenceExport.mode "tenants") (empty .Values.evidenceExport.orgIDs) }}
{{- fail "evidenceExport.orgIDs must not be empty when mode=tenants" }}
{{- end }}
# PR-O4.1/O4.2: Scheduled evidence bundle export + offline verification.
#
# Each run:
#   1. Creates a timestamped output directory (/exports/... or /tmp/evidence/...).
#   2. Runs audit-export-evidence (global or per-tenant).
#   3. Runs audit-verify --bundle. Failure stops the Job immediately.
#   4. (storage=s3) Uploads bundle zip via evidence-upload to S3. Failure fails Job.
#   5. (storage=pvc) Removes local bundles older than retentionDays.
#   6. (chainSecret=true) Runs live audit-verify --include-anchors against DB.
#
# exit code != 0 → Job fails → kube_job_status_failed alert fires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "shadowai.fullname" . }}-evidence-export
  labels:
    {{- include "shadowai.labels" . | nindent 4 }}
    app.kubernetes.io/component: evidence-export
spec:
  schedule: {{ .Values.evidenceExport.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.evidenceExport.deadlineSeconds | default 3600 }}
      template:
        metadata:
          labels:
            {{- include "shadowai.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: evidence-export
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          {{- with .Values.evidenceExport.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: evidence-export
              image: {{ include "shadowai.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%d-%H%M%S)
                  YYYY=$(date -u +%Y)
                  MM=$(date -u +%m)
                  DD=$(date -u +%d)
                  echo "[evidence-export] run started at ${TS} storage={{ .Values.evidenceExport.storage }}"

                  # Runtime guard against --set bypasses.
                  MODE="{{ .Values.evidenceExport.mode }}"
                  case "${MODE}" in global|tenants) ;;
                    *) echo "ERROR: unknown mode=${MODE}" >&2; exit 2 ;; esac
                  STORAGE="{{ .Values.evidenceExport.storage }}"
                  case "${STORAGE}" in pvc|s3) ;;
                    *) echo "ERROR: unknown storage=${STORAGE}" >&2; exit 2 ;; esac

                  {{- if eq .Values.evidenceExport.storage "pvc" }}
                  EXPORTS_BASE="/exports"
                  {{- else }}
                  # S3 mode: use local /tmp as staging area; never keep bundles on-disk.
                  EXPORTS_BASE="/tmp/evidence"
                  mkdir -p "${EXPORTS_BASE}"
                  {{- end }}

                  run_export() {
                    local OUT="$1"
                    local FLAGS="$2"
                    echo "[evidence-export] export → ${OUT}"
                    audit-export-evidence \
                      --output "${OUT}" \
                      ${FLAGS} \
                      {{- if .Values.evidenceExport.pubKeyFile }}
                      --pubkey-file {{ .Values.evidenceExport.pubKeyFile }} \
                      {{- end }}
                      --zip \
                      --table all
                    echo "[evidence-export] verify bundle ${OUT}"
                    audit-verify --bundle "${OUT}" --verbose
                    {{- if eq .Values.evidenceExport.storage "s3" }}
                    BUNDLE_NAME=$(basename "${OUT}")
                    S3_KEY="{{ .Values.evidenceExport.s3.prefix }}/${YYYY}/${MM}/${DD}/${BUNDLE_NAME}.zip"
                    echo "[evidence-export] upload → s3://{{ .Values.evidenceExport.s3.bucket }}/${S3_KEY}"
                    evidence-upload \
                      --file "${OUT}.zip" \
                      --bucket "{{ .Values.evidenceExport.s3.bucket }}" \
                      --key "${S3_KEY}" \
                      --region "{{ .Values.evidenceExport.s3.region | default "us-east-1" }}" \
                      {{- if .Values.evidenceExport.s3.endpoint }}
                      --endpoint "{{ .Values.evidenceExport.s3.endpoint }}" \
                      {{- end }}
                      {{- if .Values.evidenceExport.s3.forcePathStyle }}
                      --force-path-style \
                      {{- end }}
                      --timeout 120
                    # Remove local staging copy after successful upload.
                    rm -rf "${OUT}" "${OUT}.zip" || true
                    {{- end }}
                  }

                  {{- if eq .Values.evidenceExport.mode "global" }}
                  run_export "${EXPORTS_BASE}/global-${TS}" "--global"
                  {{- else }}
                  {{- range .Values.evidenceExport.orgIDs }}
                  run_export "${EXPORTS_BASE}/tenant-{{ . }}-${TS}" "--org-id {{ . }}"
                  {{- end }}
                  {{- end }}

                  {{- if .Values.evidenceExport.chainSecret }}
                  echo "[evidence-export] live chain+anchor verify (W2+W3)"
                  audit-verify --include-anchors --table all --verbose
                  {{- end }}

                  {{- if eq .Values.evidenceExport.storage "pvc" }}
                  RETENTION={{ .Values.evidenceExport.retentionDays | default 90 }}
                  echo "[evidence-export] cleaning PVC exports older than ${RETENTION} days"
                  find /exports -mindepth 1 -maxdepth 1 -type d -mtime +${RETENTION} -exec rm -rf {} + || true
                  find /exports -mindepth 1 -maxdepth 1 -name "*.zip" -mtime +${RETENTION} -delete || true
                  {{- end }}

                  echo "[evidence-export] run complete"

              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: databaseUrl
                {{- if .Values.evidenceExport.chainSecret }}
                - name: AUDIT_CHAIN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: auditChainSecret
                {{- end }}
                {{- if eq .Values.evidenceExport.storage "s3" }}
                {{- $s3Secret := .Values.evidenceExport.s3.secretName | default .Values.existingSecret }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $s3Secret }}
                      key: {{ .Values.evidenceExport.s3.accessKeyIDKey | default "s3AccessKeyID" }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $s3Secret }}
                      key: {{ .Values.evidenceExport.s3.secretAccessKeyKey | default "s3SecretAccessKey" }}
                {{- end }}

              resources:
                requests:
                  cpu: {{ .Values.evidenceExport.resources.requests.cpu | default "100m" }}
                  memory: {{ .Values.evidenceExport.resources.requests.memory | default "128Mi" }}
                limits:
                  cpu: {{ .Values.evidenceExport.resources.limits.cpu | default "500m" }}
                  memory: {{ .Values.evidenceExport.resources.limits.memory | default "512Mi" }}

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]

              volumeMounts:
                {{- if eq .Values.evidenceExport.storage "pvc" }}
                - name: exports
                  mountPath: /exports
                {{- end }}
                {{- if .Values.evidenceExport.pubKeyFile }}
                - name: pubkey
                  mountPath: {{ .Values.evidenceExport.pubKeyFile | dir }}
                  readOnly: true
                {{- end }}

          volumes:
            {{- if eq .Values.evidenceExport.storage "pvc" }}
            - name: exports
              persistentVolumeClaim:
                claimName: {{ include "shadowai.fullname" . }}-evidence-exports
            {{- end }}
            {{- if .Values.evidenceExport.pubKeyFile }}
            - name: pubkey
              secret:
                secretName: {{ .Values.existingSecret }}
                items:
                  - key: anchorPubKey
                    path: {{ .Values.evidenceExport.pubKeyFile | base }}
            {{- end }}
{{- end }}

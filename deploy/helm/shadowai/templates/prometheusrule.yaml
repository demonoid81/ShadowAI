{{- $exportAlerts := .Values.evidenceExport.alerts.enabled }}
{{- $auditAlerts := and .Values.evidenceAuditReport.enabled .Values.evidenceAuditReport.alerts.enabled }}
{{- if or $exportAlerts $auditAlerts }}
# PR-O4.1/O4.4: PrometheusRule for evidence pipeline alerting.
# Requires kube-state-metrics (kube_job_status_failed, kube_cronjob_next_schedule_time).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shadowai.fullname" . }}-evidence
  labels:
    {{- include "shadowai.labels" . | nindent 4 }}
    app.kubernetes.io/component: evidence-export
    {{- with .Values.evidenceExport.alerts.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:

    {{- if $exportAlerts }}
    - name: shadowai.evidence-export
      interval: {{ .Values.evidenceExport.alerts.evaluationInterval | default "1m" }}
      rules:

        # Alert: evidence-export Job failed (exit code != 0).
        # This means either audit-export-evidence or audit-verify --bundle returned non-zero.
        - alert: EvidenceExportJobFailed
          expr: |
            kube_job_status_failed{
              namespace="{{ .Release.Namespace }}",
              job_name=~"{{ include "shadowai.fullname" . }}-evidence-export-.*"
            } > 0
          for: 1m
          labels:
            severity: {{ .Values.evidenceExport.alerts.severity | default "critical" }}
            team: platform
          annotations:
            summary: "ShadowAI evidence export job failed"
            description: >-
              The evidence-export CronJob {{ include "shadowai.fullname" . }}-evidence-export
              failed. This means either the bundle export or the offline verify step
              returned a non-zero exit code. Check Job logs immediately.
            runbook: "https://docs.shadowai.internal/runbooks/evidence-export#job-failed"

        # Alert: evidence-export CronJob has not run within 2× its expected interval.
        # Detects CronJob suspensions, misconfigured schedules, or controller issues.
        # absent() OR ensures the alert fires even when the metric series is absent
        # (first deployment, kube-state-metrics restart, label selector mismatch).
        - alert: EvidenceExportJobMissing
          expr: |
            absent(
              kube_cronjob_status_last_schedule_time{
                namespace="{{ .Release.Namespace }}",
                cronjob="{{ include "shadowai.fullname" . }}-evidence-export"
              }
            )
            OR
            (
              time()
              - kube_cronjob_status_last_schedule_time{
                  namespace="{{ .Release.Namespace }}",
                  cronjob="{{ include "shadowai.fullname" . }}-evidence-export"
                }
            )
            > {{ .Values.evidenceExport.alerts.missingAfterSeconds | default 172800 }}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "ShadowAI evidence export CronJob has not run"
            description: >-
              The evidence-export CronJob {{ include "shadowai.fullname" . }}-evidence-export
              has not run for more than
              {{ .Values.evidenceExport.alerts.missingAfterSeconds | default 172800 | int | divf 3600 | floor }} hours.
              Check CronJob suspension status and controller logs.
            runbook: "https://docs.shadowai.internal/runbooks/evidence-export#job-missing"

        # Note: EvidenceBundleVerifyFailed was removed — it used the same
        # kube_job_status_failed expression as EvidenceExportJobFailed, making it
        # indistinguishable from DB outages, PVC full, or config errors.
        # EvidenceExportJobFailed (above) is the canonical alert for any Job exit != 0.
    {{- end }}

    {{- if $auditAlerts }}
    - name: shadowai.evidence-audit-report
      interval: 1m
      rules:

        # Alert: evidence-audit-report Job failed (exit 1 = violations found, exit 2 = S3 error).
        # Retention drift or S3 connectivity failure both surface here.
        - alert: EvidenceAuditReportJobFailed
          expr: |
            kube_job_status_failed{
              namespace="{{ .Release.Namespace }}",
              job_name=~"{{ include "shadowai.fullname" . }}-evidence-audit-report-.*"
            } > 0
          for: 1m
          labels:
            severity: {{ .Values.evidenceAuditReport.alerts.severity | default "warning" }}
            team: platform
          annotations:
            summary: "ShadowAI evidence retention audit report job failed"
            description: >-
              The evidence-audit-report CronJob
              {{ include "shadowai.fullname" . }}-evidence-audit-report failed.
              Exit 1 means one or more bundles violate the Object Lock retention policy.
              Exit 2 means an S3 access or configuration error.
              Check Job logs for violation details.
            runbook: "https://docs.shadowai.internal/runbooks/evidence-export#audit-report-failed"

        # Alert: evidence-audit-report CronJob has not run within the configured window.
        - alert: EvidenceAuditReportJobMissing
          expr: |
            absent(
              kube_cronjob_status_last_schedule_time{
                namespace="{{ .Release.Namespace }}",
                cronjob="{{ include "shadowai.fullname" . }}-evidence-audit-report"
              }
            )
            OR
            (
              time()
              - kube_cronjob_status_last_schedule_time{
                  namespace="{{ .Release.Namespace }}",
                  cronjob="{{ include "shadowai.fullname" . }}-evidence-audit-report"
                }
            )
            > {{ .Values.evidenceAuditReport.alerts.missingAfterSeconds | default 604800 }}
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "ShadowAI evidence audit-report CronJob has not run"
            description: >-
              The evidence-audit-report CronJob
              {{ include "shadowai.fullname" . }}-evidence-audit-report
              has not run for more than
              {{ .Values.evidenceAuditReport.alerts.missingAfterSeconds | default 604800 | int | divf 3600 | floor }} hours.
              Check CronJob suspension status.
            runbook: "https://docs.shadowai.internal/runbooks/evidence-export#audit-report-missing"
    {{- end }}

{{- end }}

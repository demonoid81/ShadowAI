apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shadowai.fullname" . }}-config
  labels:
    {{- include "shadowai.labels" . | nindent 4 }}
data:
  # Non-secret application config mounted as envFrom in the Deployment.
  # Keys in .Values.config MUST be SCREAMING_SNAKE_CASE env var names
  # (e.g. AUDIT_PURGE_CHUNK_SIZE: "1000", not auditPurgeChunkSize).
  # The Helm template writes them verbatim — no camelCase conversion.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

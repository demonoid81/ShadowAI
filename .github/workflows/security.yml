name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1'  # weekly on Mondays at 06:00 UTC

jobs:
  # Go dependency vulnerability scan.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan core for vulnerabilities
        run: govulncheck ./...
      - name: Scan enterprise for vulnerabilities
        # Enterprise build pulls in go-oidc, pquerna/otp — scan them too.
        run: govulncheck -tags enterprise ./...

  # Static analysis with golangci-lint.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: backend
          args: --timeout 5m

  # Container image security scan (Trivy) — core and enterprise images.
  trivy:
    name: Trivy image scan (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # scan both even if one fails
      matrix:
        variant:
          - core
          - enterprise
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: shadowai:trivy-scan-${{ matrix.variant }}
          build-args: |
            BUILD_TAGS=${{ matrix.variant == 'enterprise' && 'enterprise' || '' }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}

      - name: Trivy scan (${{ matrix.variant }})
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shadowai:trivy-scan-${{ matrix.variant }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
